<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postulaciones · Panel IGI</title>
<link rel="stylesheet" href="estilo.css">
<style>
  /* Estilos propios de la pantalla (por si estilo.css no cubre estas clases). */
  :root{ --naranja:#c96d18; --tinta:#1a2430; --gris:#67788a; --linea:#e2e8ef; }
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--tinta);background:#f4f6f8;margin:0}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .top h1{font-size:20px;margin:0}
  .top .marca{font-weight:800;color:var(--naranja);letter-spacing:.05em;font-size:13px}
  .barra{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .barra input,.barra select{padding:9px 11px;border:1.5px solid var(--linea);border-radius:9px;font-size:14px;font-family:inherit;background:#fff}
  .barra input{min-width:220px}
  .card{background:#fff;border:1px solid var(--linea);border-radius:12px;margin-bottom:12px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
  .row:hover{background:#fafbfc}
  .row .nom{font-weight:700}
  .row .sub{font-size:12.5px;color:var(--gris)}
  .row .crece{flex:1;min-width:0}
  .pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .e-nuevo{background:#eaf3ff;color:#1e5bbf}
  .e-en_revision{background:#fff4e5;color:#b8600f}
  .e-entrevista{background:#efe9ff;color:#5b3fbf}
  .e-contratado{background:#e8f8ee;color:#166534}
  .e-descartado{background:#f2f3f5;color:#67788a}
  .det{display:none;border-top:1px solid var(--linea);padding:16px;background:#fbfcfd}
  .det.abierto{display:block}
  .det .g{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px;margin-bottom:12px}
  .det .lbl{font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em}
  .det .val{font-size:14px;word-break:break-word}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#eef1f5;border-radius:16px;padding:3px 10px;font-size:12.5px}
  .acc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .btn{border:0;border-radius:9px;padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.naranja{background:var(--naranja);color:#fff}
  .btn.borde{background:#fff;border:1.5px solid var(--linea);color:var(--tinta)}
  .acc select,.acc input{padding:9px 11px;border:1.5px solid var(--linea);border-radius:9px;font-size:14px;font-family:inherit}
  .vacio{text-align:center;color:var(--gris);padding:50px 20px}
  .aviso{background:#fff4e5;border:1px solid #f2c98a;color:#8a4f0f;padding:10px 14px;border-radius:9px;margin-bottom:12px;font-size:13.5px;display:none}
  @media(max-width:640px){ .det .g{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="marca">IGI · PANEL</div>
      <h1>Postulaciones — Trabajá con nosotros</h1>
    </div>
    <div><a class="btn borde" href="/panel.html">← Volver al panel</a></div>
  </div>

  <div class="aviso" id="aviso"></div>

  <div class="barra">
    <input id="q" placeholder="Buscar por nombre o email…" oninput="pintar()">
    <select id="fEstado" onchange="pintar()">
      <option value="">Todos los estados</option>
      <option value="nuevo">Nuevo</option>
      <option value="en_revision">En revisión</option>
      <option value="entrevista">Entrevista</option>
      <option value="contratado">Contratado</option>
      <option value="descartado">Descartado</option>
    </select>
    <button class="btn borde" onclick="cargar()">↻ Actualizar</button>
    <button class="btn borde" onclick="exportarCSV()">⬇️ Exportar CSV</button>
  </div>

  <div id="lista"></div>
</div>

<script>
const ESTADOS = {nuevo:'Nuevo', en_revision:'En revisión', entrevista:'Entrevista', contratado:'Contratado', descartado:'Descartado'};
let DATA = [];

function aviso(t){ const a=document.getElementById('aviso'); a.textContent=t; a.style.display='block'; }

async function api(url, opt){
  const r = await fetch(url, Object.assign({credentials:'same-origin'}, opt||{}));
  if(r.status===401){ location.href='/login.html'; return null; }
  return r;
}

async function cargar(){
  const r = await api('postulaciones.php?accion=listar');
  if(!r) return;
  const j = await r.json();
  if(j.error){ aviso(j.error); return; }
  DATA = j.items || [];
  pintar();
}

function pintar(){
  const q = (document.getElementById('q').value||'').toLowerCase();
  const fe = document.getElementById('fEstado').value;
  const lista = DATA.filter(p =>
    (!fe || p.estado===fe) &&
    (!q || (p.nombre+' '+p.email).toLowerCase().includes(q))
  );
  const cont = document.getElementById('lista');
  if(!lista.length){ cont.innerHTML = '<div class="vacio">No hay postulaciones para mostrar.</div>'; return; }
  cont.innerHTML = lista.map(p => tarjeta(p)).join('');
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function tarjeta(p){
  const fecha = p.ts ? new Date(p.ts).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '';
  const filiales = (p.filiales_nombres||[]).map(f=>`<span class="chip">${esc(f)}</span>`).join('');
  const areas = (p.areas||[]).map(a=>`<span class="chip">${esc(a)}</span>`).join('');
  const cv = p.cv ? `<a class="btn borde" href="postulaciones.php?accion=cv&id=${encodeURIComponent(p.id)}" target="_blank" rel="noopener">📄 Ver CV</a>`
                  : `<span class="sub">Sin CV adjunto${p.linkedin?' (ver link abajo)':''}</span>`;
  const link = p.linkedin ? `<div><div class="lbl">LinkedIn / CV</div><div class="val"><a href="${esc(p.linkedin)}" target="_blank" rel="noopener">${esc(p.linkedin)}</a></div></div>` : '';
  const notas = (p.notas||[]).map(n=>`<div class="sub">• ${esc(n.nota)} <i>— ${esc(n.usuario)}</i></div>`).join('');
  const opts = Object.entries(ESTADOS).map(([k,v])=>`<option value="${k}" ${p.estado===k?'selected':''}>${v}</option>`).join('');
  return `<div class="card">
    <div class="row" onclick="this.parentNode.querySelector('.det').classList.toggle('abierto')">
      <div class="crece">
        <div class="nom">${esc(p.nombre)}</div>
        <div class="sub">${esc(p.email)} · ${esc(p.telefono)} · ${fecha}</div>
      </div>
      <span class="pill e-${p.estado}">${ESTADOS[p.estado]||p.estado}</span>
    </div>
    <div class="det">
      <div class="g">
        <div><div class="lbl">Áreas</div><div class="chips">${areas||'—'}</div></div>
        <div><div class="lbl">Filiales elegidas</div><div class="chips">${filiales||'—'}</div></div>
        ${link}
        ${p.mensaje?`<div style="grid-column:1/-1"><div class="lbl">Mensaje</div><div class="val">${esc(p.mensaje)}</div></div>`:''}
      </div>
      ${notas?`<div style="margin-bottom:10px">${notas}</div>`:''}
      <div class="acc">
        ${cv}
        <select id="es-${p.id}">${opts}</select>
        <input id="nt-${p.id}" placeholder="Nota interna (opcional)">
        <button class="btn naranja" onclick="guardarEstado('${p.id}')">Guardar</button>
      </div>
    </div>
  </div>`;
}

async function guardarEstado(id){
  const estado = document.getElementById('es-'+id).value;
  const nota = document.getElementById('nt-'+id).value;
  const r = await api('postulaciones.php?accion=estado', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, estado, nota})
  });
  if(!r) return;
  const j = await r.json();
  if(j.error){ aviso(j.error); return; }
  await cargar();
}

function exportarCSV(){
  const filas = [['Nombre','Email','Teléfono','Áreas','Filiales','Estado','LinkedIn/CV','Mensaje','Fecha']];
  DATA.forEach(p => filas.push([
    p.nombre, p.email, p.telefono, (p.areas||[]).join(' / '),
    (p.filiales_nombres||[]).join(' / '), ESTADOS[p.estado]||p.estado,
    p.linkedin||'', (p.mensaje||'').replace(/\n/g,' '), p.ts||''
  ]));
  const csv = filas.map(f => f.map(c => '"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,﻿' + encodeURIComponent(csv);
  a.download = 'postulaciones-igi.csv';
  a.click();
}

cargar();
</script>
</body>
</html>
