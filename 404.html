<!DOCTYPE html>

<title>Página no encontrada — IGI Instituto Gastronómico Internacional</title>
<meta name="robots" content="noindex,follow">
<script>
/* GitHub Pages sirve este 404.html ante cualquier ruta inexistente.
   Recuperamos las URLs viejas conocidas hacia la home de país correspondiente.
   (Pages no puede emitir un 301 real; esto redirige al usuario y Google termina soltando la vieja.) */
(function(){
  var P={argentina:'/ar/',paraguay:'/py/',bolivia:'/bo/',brasil:'/br/',brazil:'/br/',chile:'/cl/',colombia:'/co/',uruguay:'/uy/'};
  var path=(location.pathname||'').toLowerCase(), qs=(location.search||'').toLowerCase()+(location.hash||'').toLowerCase();
  try{
    if(path.indexOf('inicial.php')>=0){
      var m=qs.match(/pais=([a-zñ]+)/);
      if(m && P[m[1]]){ location.replace(P[m[1]]); return; }
      location.replace('/'); return;
    }
    if(path.indexOf('/landing/')>=0 || /\.php(?:$|\/|\?)/.test(path)){ location.replace('/'); return; }
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="/estilos-igi.css">
<style>
.nf-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px;background:linear-gradient(140deg,#10182b,#243354)}

.nf-paises a:hover{color:var(--naranja)}
</style>
<script>
(function(){
  var GA_ID='G-2H24GS3HKH', CLARITY_ID='y1n5mo1dsk';
  window.dataLayer=window.dataLayer||[];
  window.gtag=window.gtag||function(){dataLayer.push(arguments);};
  window.igiTrack=function(name,params){ try{ if(window.gtag) gtag('event',name,params||{}); }catch(e){} };
  try{
    var s=document.createElement('script'); s.async=1; s.src='https://www.googletagmanager.com/gtag/js?id='+GA_ID; document.head.appendChild(s);
    gtag('js', new Date()); gtag('config', GA_ID, {anonymize_ip:true});
    (function(c,l,a,r,i,t,y){ c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)}; t=l.createElement(r);t.async=1;t.src='https://www.clarity.ms/tag/'+i; y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y); })(window,document,'clarity','script',CLARITY_ID);
  }catch(e){}
  /* ===== Eventos de conversión (auto-enganche, sin tocar el JS de cada página) ===== */
  try{
    var WA=/wa\.me|api\.whatsapp\.com|whatsapp\.com\/send|wa\.link/i, _lastWa=0;
    function waHit(url){ var n=+new Date(); if(n-_lastWa<900) return; _lastWa=n; window.igiTrack('whatsapp_click',{link_url:(''+(url||'')).slice(0,120), page:location.pathname}); }
    /* 1) botones que abren WhatsApp con window.open (fichas de programa, botón flotante, páginas nuevas) */
    var _open=window.open;
    window.open=function(u){ try{ if(u&&WA.test(''+u)) waHit(u); }catch(e){} return _open.apply(this,arguments); };
    /* 2) enlaces <a href="wa.me"> (fichas de filial y demás anchors) */
    document.addEventListener('click',function(e){ try{ var t=e.target, a=t&&t.closest?t.closest('a[href]'):null; if(a&&WA.test(a.getAttribute('href')||'')) waHit(a.getAttribute('href')); }catch(_){} },true);
    /* 3) formularios: consultas.php (lead) y postulaciones.php (postulación), vía fetch */
    var _fetch=window.fetch;
    if(_fetch){ window.fetch=function(u,opt){
      try{ var url=''+((u&&u.url)?u.url:u), body=(opt&&typeof opt.body==='string')?opt.body:'';
        if(/consultas\.php/i.test(url)){ if(!/origen["'\s:]*whatsapp/i.test(body)) window.igiTrack('generate_lead',{via: /programa_pdf["'\s:]*[^"',}]{4,}/i.test(body)?'folleto_mail':'form', page:location.pathname}); }
        else if(/postulaciones\.php/i.test(url)){ window.igiTrack('postulacion',{page:location.pathname}); }
      }catch(_){}
      return _fetch.apply(this,arguments);
    }; }
  }catch(e){}
})();
</script>
